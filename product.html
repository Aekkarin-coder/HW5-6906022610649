<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/gridstyle.css">
    <title>PRODUCT</title>
</head>
<body>
    <div class="grid-layout">
        <div class="header">
            <img src="/images/header.jpg" alt="header">
        </div>
        <div class="nav">
            <a href="index.html">HOME</a>
            <a href="product.html">PRODUCT</a>
        </div>
        <div class="left-on">
            <h3>Our Catalog</h3>
            <p>Browse product and details below.</p>
            <img src="/images/product1.jpg" alt="item1">
        </div>
        <div class="right">
            <form action="">
                <h3>สมัครสมาชิก</h3>
                <div class="input-box">
                    <label for="name">ชื่อ</label><br>
                    <input type="text" id="name" placeholder="ชื่อจริง" required>
                </div>
                <div class="input-box">
                    <label for="surname">นามสกุล</label><br>
                    <input type="text" id="surname" placeholder="นามสกุล" required>
                </div>
                <div class="input-box">
                    <label for="email">อีเมล</label><br>
                    <input type="text" id="email" placeholder="aura@email.com" required>
                </div>
                <div class="input-box">
                    <label for="pass">รหัสผ่าน</label><br>
                    <input type="text" id="pass" placeholder="รหัสผ่าน" required>
                </div>
                <div class="input-box">
                    <label for="cpass">ยืนยันรหัสผ่าน</label><br>
                    <input type="text" id="cpass" placeholder="ยืนยันรหัสผ่าน" required>
                </div>
                <div class="input-box">
                    <label for="phone">เบอร์โทรศัพท์</label><br>
                    <input type="text" id="phone" placeholder="08X-XXX-XXXX" required>
                </div>
                <div class="gender">
                    <label for="">เพศ</label><br>
                        <input type="radio" id="man" name="gender">
                        <label for="man">ชาย</label><br>
                        <input type="radio" id="girl" name="gender">
                        <label for="girl">หญิง</label><br>
                        <input type="radio" id="none" name="gender">
                        <label for="none">ไม่ระบุ</label>
                </div>
                <div class="under-gender">
                    <input type="checkbox">
                    <label for="">รับข่าวสาร</label>
                    <input type="checkbox">
                    <label for="">โปรโมชั่น</label>
                    <input type="checkbox">
                    <label for="">กิจกรรม</label>
                </div>
                <div class="member">
                    <h3>ประเภทสมาชิก</h3>
                    <select name="" id="">
                        <option value="">Normal</option>
                        <option value="">Premium</option>
                        <option value="">VIP</option>
                    </select>
                    <input type="checkbox">
                    <label for="">ยอมรับข้อกำหนดและเงื่อนไข</label>
                </div>
                <div class="submit-box">
                    <input type="submit"><br>
                    <label for="">เราจะเก็บข้อมูลของคุณเป็นความลับ</label>
                </div>
            </form>
        </div>
        
        <div class="left-under">
            <h3>Product Name</h3>
            <p>Short description, price, and action (add to cart, view details).</p>
            <img src="/images/product2.jpg" alt="item2">
        </div>
        <div class="footer">
            <img src="/images/footer.jpg" alt="footer">
        </div>
    </div>
</body>
</html>
